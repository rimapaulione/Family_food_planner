name: test-actions
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and run test commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.FOOD_PLANNER_DEPLOY }}
          script: |
            echo "Hello from EC2!"
            whoami
            hostname
            uptime