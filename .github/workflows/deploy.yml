name: Deploy to EC2

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: family_food_planner
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run backend tests
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: family_food_planner
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: ./mvnw test
        working-directory: planner_backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: planner_ui/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: planner_ui
      - name: Build frontend
        run: npm run build
        working-directory: planner_ui

  deploy:
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.FOOD_PLANNER_DEPLOY }}
          script: |
            cd Family_food_planner/
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
