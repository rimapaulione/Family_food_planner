spring:
  application:
    name: family_food_planner_backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:family_food_planner}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html


jwt:
  secret: ${JWT_SECRET:change-in-production-make-at-least-32-chars-long}
  access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY:60}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini